<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bootstrap Calculator</title>

    <!-- Bootstrap 5.3 CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <div class="calculator">
      <input type="text" id="display" class="form-control mb-3" disabled />

      <div class="row g-2 border">
        <div class="col-3">
          <button class="btn btn-danger w-100" onclick="clearDisplay()">
            C
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-secondary w-100" onclick="appendValue('/')">
            ÷
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-secondary w-100" onclick="appendValue('*')">
            ×
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-secondary w-100" onclick="appendValue('-')">
            −
          </button>
        </div>

        <div class="col-3">
          <button class="btn btn-light w-100" onclick="appendValue('7')">
            7
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-light w-100" onclick="appendValue('8')">
            8
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-light w-100" onclick="appendValue('9')">
            9
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-secondary w-100" onclick="appendValue('+')">
            +
          </button>
        </div>

        <div class="col-3">
          <button class="btn btn-light w-100" onclick="appendValue('4')">
            4
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-light w-100" onclick="appendValue('5')">
            5
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-light w-100" onclick="appendValue('6')">
            6
          </button>
        </div>
        <div class="col-3 border">
          <button
            class="btn btn-primary w-100"
            onclick="calculate()"
            rowspan="5"
            style="min-height: calc(100)"
          >
            =
          </button>
        </div>

        <div class="col-3">
          <button class="btn btn-light w-100" onclick="appendValue('1')">
            1
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-light w-100" onclick="appendValue('2')">
            2
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-light w-100" onclick="appendValue('3')">
            3
          </button>
        </div>

        <div class="col-6">
          <button class="btn btn-light w-100" onclick="appendValue('0')">
            0
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-light w-100" onclick="appendValue('.')">
            .
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
